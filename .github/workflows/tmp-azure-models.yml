name: tmp-azure-models
# Temporary: lists which models the Azure secrets can reach. Prints secret NAMES and model names only.
on:
  push:
    branches: [claude/project-thread-r5zqd1]
    paths: [.github/workflows/tmp-azure-models.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          s = json.loads(os.environ["SECRETS_JSON"])
          print("Secret names:", sorted(k for k in s if k != "github_token"))
          az = {k: v for k, v in s.items() if "AZURE" in k.upper() or "FOUNDRY" in k.upper() or "OPENAI" in k.upper()}
          hosts = {"badminton host": "https://happy-badminton-jay-main-1.openai.azure.com"}
          keys = {}
          for k, v in az.items():
              v = v.strip()
              if v.startswith("http"):
                  hosts[k] = v.rstrip("/")
              else:
                  keys[k] = v
          print("Endpoint-like secrets:", [h for h in hosts if h != "badminton host"])
          print("Key-like secrets:", list(keys))
          def req(url, key, body=None, extra=None):
              h = {"api-key": key, "x-api-key": key, "Authorization": "Bearer " + key, "content-type": "application/json"}
              h.update(extra or {})
              r = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
              except Exception as e:
                  return 0, str(e)[:200]
          claude = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5", "claude-fable-5-2", "claude-fable-5-1",
                    "claude-opus-5", "claude-sonnet-5", "claude-opus-4-8", "claude-opus-4-7", "claude-sonnet-4-6",
                    "claude-opus-4-6", "claude-haiku-4-5", "claude-sonnet-4-5", "claude-opus-4-5"]
          for hn, host in hosts.items():
              base = host.split("/anthropic")[0].split("/openai")[0].split("/models")[0]
              for kn, key in keys.items():
                  print(f"\n=== {hn} x {kn} ===")
                  for path in ["/openai/deployments?api-version=2022-12-01", "/openai/models?api-version=2024-10-21", "/models/info?api-version=2024-05-01-preview"]:
                      st, txt = req(base + path, key)
                      if st == 200:
                          try:
                              d = json.loads(txt)
                              items = d.get("data") or d.get("value") or d
                              if isinstance(items, list):
                                  names = sorted({(i.get("model") or i.get("id") or "") + ("" if not i.get("id") or i.get("model") in (None, i.get("id")) else f" (deployment {i.get('id')})") for i in items})
                                  print(f"{path.split('?')[0]}: {len(names)} -> {names[:80]}")
                              else:
                                  print(f"{path.split('?')[0]}: {str(d)[:300]}")
                          except Exception:
                              print(f"{path.split('?')[0]}: 200 {txt[:200]}")
                      else:
                          print(f"{path.split('?')[0]}: HTTP {st}")
                  ok = []
                  for m in claude:
                      st, txt = req(base + "/anthropic/v1/messages", key,
                                    {"model": m, "max_tokens": 1, "messages": [{"role": "user", "content": "hi"}]},
                                    {"anthropic-version": "2023-06-01"})
                      print(f"anthropic {m}: HTTP {st}" + ("" if st == 200 else " " + txt[:120].replace(chr(10), " ")))
                      if st == 200: ok.append(m)
                  print("Claude models OK:", ok)
