# Temporary (not to merge): look at the TTB public COLA search forms
name: tmp TTB probe
on:
  pull_request:
    paths: [".github/workflows/tmp-ttb-probe.yml", "scripts/ttb_export.py"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install -q requests beautifulsoup4 certifi
      - run: python3 scripts/ttb_export.py 2026-10-01 2026-10-03 probe.csv --probe
