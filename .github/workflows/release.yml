name: Release

# 一键发布正式站: Actions → Release → Run workflow (on main). Tags the latest main as vYYYY.MM.DD
# (Pacific date; .2, .3 … for later releases the same day), publishes a GitHub release with the
# merged PRs as notes, then deploys wine.llmat.dev in this same run (deploy.yml).
# Only a commit whose CI on main is green can be released. It can be run right after a merge: it
# waits for that CI (up to 15 minutes) instead of failing while it is still running.
#
# 版本: empty makes a new release from main; an existing tag, e.g. v2026.11.18, makes no release and
# only deploys that one again (redeploy, or roll back to it).
#
# 自动发布: CI on main calls this after the test site is deployed (ci.yml, job auto-release), so
# every green merge goes to production. Switch it off without a code change: Settings → Secrets and
# variables → Actions → Variables → AUTO_RELEASE = false (delete it, or set true, to switch back on).
#
# The tag and release are created with this workflow's token, which does not fire ci.yml's tag-push
# run; nothing needs it, since the deploy is part of this run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本：留空 = 用最新的 main 打一个新版本；填已有版本（如 v2026.11.18）= 不打新版本，只重新部署它（补上或回滚）"
        type: string
        required: false
      notes:
        description: "发布说明（Markdown，可留空；合并的 PR 列表总会附在后面；只用于新版本）"
        type: string
        required: false
  workflow_call:
    inputs:
      ci_green:
        description: Called by CI on main after its checks passed, so not waiting for CI
        type: boolean
        default: false
      tag:
        type: string
        default: ""
      notes:
        type: string
        default: ""

permissions:
  contents: write # tag + release
  actions: read # CI state of main

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    outputs:
      tag: ${{ steps.existing.outputs.tag || steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release on main (it was run on ${GITHUB_REF_NAME})"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The existing version
        id: existing
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::没有版本 $TAG（版本像 v2026.11.18，见 Releases）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Not released yet
        if: inputs.tag == ''
        run: |
          already=$(git tag --points-at "$GITHUB_SHA" 'v*' | head -1)
          if [ -n "$already" ]; then
            echo "::error::${GITHUB_SHA:0:7} 已经发布过了，版本是 $already。要重新部署它，在「版本」里填 $already 再运行"
            exit 1
          fi
      - name: main must be green (waits while its CI runs)
        if: inputs.tag == '' && !inputs.ci_green
        run: |
          for i in $(seq 90); do
            state=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion,headBranch \
              --jq '[.[] | select(.headBranch == "main")][0] | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") exit 0 ;;
              completed*)
                echo "::error::CI on main for ${GITHUB_SHA:0:7} did not pass (${state#completed }); fix it first, or run Release again once a newer main is green"
                exit 1 ;;
            esac
            [ "$i" = 1 ] && echo "Waiting for CI on main for ${GITHUB_SHA:0:7} (${state:-not started yet})"
            sleep 10
          done
          echo "::error::CI on main for ${GITHUB_SHA:0:7} has not finished after 15 minutes"
          exit 1
      - name: Pick the version
        id: version
        if: inputs.tag == ''
        run: |
          day=$(TZ=America/Los_Angeles date +%Y.%m.%d)
          tag="v$day"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do
            n=$((n + 1))
            tag="v$day.$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag and publish the release
        if: inputs.tag == ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --generate-notes
      - name: Summary
        env:
          TAG: ${{ steps.existing.outputs.tag || steps.version.outputs.tag }}
        run: |
          {
            echo "### Releasing $TAG"
            echo
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- Production deploy: the deploy job of this run"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.tag }}
    secrets: inherit
