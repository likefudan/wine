name: Load LWIN

# Loads the wine directory into a site's database (README「LWIN wine directory」「American wine labels」).
# The SQL made by scripts/lwin_import.py (lwin/lwin.sql) or scripts/ttb_import.py (ttb/ttb.sql) is kept
# in the test site's private photo bucket, not in this repository: Actions → Load LWIN → Run workflow,
# then pick the data and the site. Each replaces only its own rows.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging（测试站）或 production（正式站）"
        type: choice
        options: [staging, production]
        default: staging
      data:
        description: "lwin（Liv-ex 酒款库）或 ttb（美国酒标）"
        type: choice
        options: [lwin, ttb]
        default: lwin

permissions:
  contents: read

concurrency: lwin-${{ inputs.target }}

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      DATA: ${{ inputs.data || 'lwin' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-deploy.mjs "$TARGET"
      - run: npx wrangler r2 object get "wine-photos-staging/$DATA/$DATA.sql" --file data.sql --remote
      - run: npx wrangler d1 execute DB --remote -y --file data.sql $([ "$TARGET" = staging ] && echo --env staging)
      - name: Count
        run: |
          npx wrangler d1 execute DB --remote --json $([ "$TARGET" = staging ] && echo --env staging) \
            --command "SELECT (SELECT count(*) FROM lwin WHERE lwin > 0) AS wines, (SELECT count(*) FROM lwin WHERE lwin < 0) AS ttb, (SELECT count(*) FROM lwin_words) AS words" \
            | tee count.json
          echo "### $TARGET — $(grep -o '"wines": *[0-9]*' count.json), $(grep -o '"ttb": *[0-9]*' count.json)" >> "$GITHUB_STEP_SUMMARY"
