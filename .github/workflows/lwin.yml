name: Load LWIN

# Loads the LWIN wine directory into a site's database (README「LWIN wine directory」). The SQL made by
# scripts/lwin_import.py is kept in the test site's private photo bucket at lwin/lwin.sql, not in this
# repository: Actions → Load LWIN → Run workflow, then pick the site.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging（测试站）或 production（正式站）"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency: lwin-${{ inputs.target }}

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-deploy.mjs "$TARGET"
      - run: npx wrangler r2 object get wine-photos-staging/lwin/lwin.sql --file lwin.sql --remote
      - run: npx wrangler d1 execute DB --remote -y --file lwin.sql $([ "$TARGET" = staging ] && echo --env staging)
      - name: Count
        run: |
          npx wrangler d1 execute DB --remote --json $([ "$TARGET" = staging ] && echo --env staging) \
            --command "SELECT (SELECT count(*) FROM lwin) AS wines, (SELECT count(*) FROM lwin_words) AS words" \
            | tee count.json
          echo "### LWIN in $TARGET: $(grep -o '"wines": *[0-9]*' count.json)" >> "$GITHUB_STEP_SUMMARY"
