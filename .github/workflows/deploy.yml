name: Deploy

# One deploy, shared by CI (main → test site wine-staging.llmat.dev) and Release (new version →
# production wine.llmat.dev). Deploys need the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (pass `secrets: inherit`); without them it says so and stops without failing.
on:
  workflow_call:
    inputs:
      target:
        description: production | staging
        type: string
        required: true
      ref:
        description: The commit or tag to deploy
        type: string
        required: true
      version:
        description: APP_VERSION shown by /api/health (the tag); empty means main-<short sha>
        type: string
        required: false
        default: ""
    outputs:
      deployed:
        description: true when it deployed (false when skipped)
        value: ${{ jobs.deploy.outputs.deployed }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy per site at a time. A newer one waiting replaces an older one waiting.
    concurrency: deploy-${{ inputs.target }}
    outputs:
      deployed: ${{ steps.go.outputs.ok }}
    env:
      TARGET: ${{ inputs.target }}
      REF: ${{ inputs.ref }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare token present, and still the newest for the test site
        id: go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret: not deploying" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Merges test in parallel, so an older commit can finish after a newer one. The test site
          # only takes the newest main; the run for that commit deploys it.
          if [ "$TARGET" = staging ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" != "$REF" ]; then
              echo "main has moved on to ${head:0:7}: its run deploys the test site, not ${REF:0:7}" >> "$GITHUB_STEP_SUMMARY"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - if: steps.go.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - if: steps.go.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.go.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund && npm run build
      - if: steps.go.outputs.ok == 'true'
        run: node scripts/prepare-deploy.mjs "$TARGET"
      # A point to roll the database back to (wrangler d1 time-travel restore DB --bookmark=…).
      - if: steps.go.outputs.ok == 'true'
        continue-on-error: true
        run: npx wrangler d1 time-travel info DB $([ "$TARGET" = staging ] && echo --env staging) | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.go.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote $([ "$TARGET" = staging ] && echo --env staging)
      - if: steps.go.outputs.ok == 'true'
        run: npx wrangler deploy $([ "$TARGET" = staging ] && echo --env staging) --var "APP_VERSION:${VERSION:-main-${REF:0:7}}"
        env:
          VERSION: ${{ inputs.version }}
      - if: steps.go.outputs.ok == 'true'
        run: node scripts/sync-secrets.mjs "$TARGET"
        env:
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - if: steps.go.outputs.ok == 'true'
        run: node scripts/smoke.mjs
        env:
          SITE_ORIGIN: ${{ inputs.target == 'production' && 'https://wine.llmat.dev' || 'https://wine-staging.llmat.dev' }}
