name: Review spike

# One-off trial for design doc 3.2 (pro reviews): reads Wine-Searcher / CellarTracker pages and asks
# Claude web search / web fetch about ~20 Napa wines, politely (scripts/review_spike.py).
# Results go to the test site's private bucket at spike/ and to the run's artifacts.
# Findings: docs/review-spike.zh.md. Actions → Review spike → Run workflow to repeat it.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "只测前几款（留空是全部）"
        default: ""
      mode:
        description: "full（全部读法）或 structured（4 款酒的结构化输出重跑）"
        type: choice
        options: [full, structured]
        default: full

permissions:
  contents: read

concurrency: review-spike

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SPIKE_LIMIT: ${{ inputs.limit || '' }}
      SPIKE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - run: pip install -q anthropic requests
      - name: Spike
        run: python3 scripts/review_spike.py spike
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-spike
          path: spike/
      - name: Save to bucket
        if: always()
        run: |
          for f in results.json pages.tar.gz structured.json; do
            [ -f "spike/$f" ] && npx -y wrangler@4 r2 object put "wine-photos-staging/spike/$f" --file "spike/$f" --remote
          done
