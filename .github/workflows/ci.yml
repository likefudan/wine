name: CI

# Pull requests: checks only.
# Merge to main: checks (skipped when a pull request already tested exactly these files), then deploy
# to the test site (wine-staging.llmat.dev).
# Push a release tag v* (e.g. v2026.11.18): checks, then deploy to production (wine.llmat.dev).
# Release (release.yml) deploys production itself and does not start this workflow.
# 自动发布: after the test site takes a new main, the auto-release job releases it to production
# unless the repository variable AUTO_RELEASE is false (see release.yml).
# Run workflow by hand: on main → redeploys staging; on a v* tag → deploys that release to production.
# The deploy itself is deploy.yml (also used by release.yml).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main and on tags do not wait for each
# other (only their deploys take turns, see deploy.yml), so merges close together test in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skip testing what was already tested:
  # - a release tag (v*) on a commit whose CI on main passed (Release only tags a green main);
  # - a commit on main whose files are exactly what a pull request's CI tested green (the usual case
  #   when the pull request was up to date with main). Each test job leaves a marker artifact
#   tested-<job>-<tree> when it passes, and both are needed.
  # Anything else is tested first.
  verified:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ok: ${{ steps.tested.outputs.ok }}
    steps:
      - id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
        run: |
          n=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main \
              --status success --json databaseId --jq length)
            why="CI on main already passed for ${GITHUB_SHA:0:7}"
          else
            tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
            n=1
            for job in check e2e; do
              m=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tested-$job-$tree&per_page=10" \
                --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length')
              [ "${m:-0}" -gt 0 ] || n=0
            done
            why="these exact files (tree ${tree:0:7}) already passed CI"
          fi
          echo "自动发布 AUTO_RELEASE=${AUTO_RELEASE:-（未设置，默认开）}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${n:-0}" -gt 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "$why: not testing them again" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Passed: these files are tested (see `verified`).
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tested-check-${{ steps.tree.outputs.tree }}
          path: package.json
          retention-days: 7
          overwrite: true

  e2e:
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser is cached per Playwright version. Only the headless shell is installed (the tests
      # run headless), and no apt packages: the runner image already has Chromium's libraries, and
      # `--with-deps` only added fonts from a slow Ubuntu mirror (it sometimes took 2-4 minutes).
      # If a newer runner image ever lacks a library, the apt install still runs as a fallback.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell
      - run: npx playwright install --only-shell chromium
      - name: Chromium libraries present
        run: |
          shell=$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell | head -1)
          if ldd "$shell" | grep -q "not found"; then
            ldd "$shell" | grep "not found"
            npx playwright install-deps chromium
          fi
      - run: npx playwright test --trace off
        env:
          WRANGLER_SEND_METRICS: "false"
      # Passed: these files are tested (see `verified`).
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tested-e2e-${{ steps.tree.outputs.tree }}
          path: package.json
          retention-days: 7
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [verified, check, e2e]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && (needs.verified.outputs.ok == 'true' || (needs.check.result == 'success' && needs.e2e.result == 'success')) }}
    uses: ./.github/workflows/deploy.yml
    with:
      target: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      ref: ${{ github.sha }}
      version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    secrets: inherit

  # 自动发布: the test site just took this main commit, so release it to production too. Off when the
  # repository variable AUTO_RELEASE is false. When main has moved on, Release leaves it to the newer
  # commit's run.
  auto-release:
    needs: deploy
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.AUTO_RELEASE != 'false' && needs.deploy.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      ci_green: true
    secrets: inherit
