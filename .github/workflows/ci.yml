name: CI

# Pull requests: checks only.
# Merge to main: checks, then deploy to the test site (wine-staging.llmat.dev).
# Push a release tag v* (e.g. v2026.11.18), or run release.yml: checks, then deploy to production (wine.llmat.dev).
# Run workflow by hand: on main → redeploys staging; on a v* tag → deploys that release to production.
# Deploys need the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them
# the deploy jobs say so and stop without failing.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release tag (v*) on a commit whose CI on main already passed deploys without running the same
  # checks and browser tests again (Release only tags a green main). Any other tag is tested first.
  verified:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ok: ${{ steps.main.outputs.ok }}
    steps:
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main \
            --status success --json databaseId --jq length)
          if [ "${n:-0}" -gt 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "CI on main already passed for ${GITHUB_SHA:0:7}: not testing it again" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser is cached per Playwright version. Only the headless shell is installed (the tests
      # run headless), and no apt packages: the runner image already has Chromium's libraries, and
      # `--with-deps` only added fonts from a slow Ubuntu mirror (it sometimes took 2-4 minutes).
      # If a newer runner image ever lacks a library, the apt install still runs as a fallback.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell
      - run: npx playwright install --only-shell chromium
      - name: Chromium libraries present
        run: |
          shell=$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell | head -1)
          if ldd "$shell" | grep -q "not found"; then
            ldd "$shell" | grep "not found"
            npx playwright install-deps chromium
          fi
      - run: npx playwright test --trace off
        env:
          WRANGLER_SEND_METRICS: "false"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [verified, check, e2e]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && (needs.verified.outputs.ok == 'true' || (needs.check.result == 'success' && needs.e2e.result == 'success')) }}
    runs-on: ubuntu-latest
    concurrency: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare token present
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret: not deploying" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.ok == 'true'
        run: npm ci && npm run build
      - if: steps.token.outputs.ok == 'true'
        run: node scripts/prepare-deploy.mjs "$TARGET"
      - if: steps.token.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote $([ "$TARGET" = staging ] && echo --env staging)
      - if: steps.token.outputs.ok == 'true'
        run: npx wrangler deploy $([ "$TARGET" = staging ] && echo --env staging) --var "APP_VERSION:${GITHUB_REF_NAME/main/main-${GITHUB_SHA:0:7}}"
      - if: steps.token.outputs.ok == 'true'
        run: node scripts/sync-secrets.mjs "$TARGET"
        env:
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - if: steps.token.outputs.ok == 'true'
        run: node scripts/smoke.mjs
        env:
          SITE_ORIGIN: ${{ env.TARGET == 'production' && 'https://wine.llmat.dev' || 'https://wine-staging.llmat.dev' }}
